<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Neon Brand Gradient (Cyan to Indigo to Purple) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Accent Secondary Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="118" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.3" />

  <!-- Glowing Monogram Group -->
  <g filter="url(#glow)">
    <!-- Letter 'A' Left Pillar & Apex -->
    <path 
      d="M136 376 L224 136 C228 124 240 116 254 116 C268 116 280 124 284 136 L312 212" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 'A' Crossbar weaving seamlessly into 'B' Middle Divider -->
    <path 
      d="M172 284 L370 284" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="44" 
      stroke-linecap="round"
    />

    <!-- Letter 'B' Upper & Lower Curved Loops -->
    <path 
      d="M260 148 H338 C375 148 404 177 404 214 C404 251 375 280 338 280 H280 M280 280 H354 C393 280 424 311 424 350 C424 389 393 420 354 420 H250 C234 420 220 408 220 392 L220 376" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="44" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Tech Core Sparkle Dot -->
    <circle cx="254" cy="202" r="14" fill="#00E5FF" opacity="0.9" />
  </g>
</svg>